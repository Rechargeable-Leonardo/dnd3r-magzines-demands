      <span style="font-size: 18pt;" class="bbc_size">灰鹰模组：伊乌兹的王座Throne of Iuz
    </p>
    <p>
      边栏：新武器附魔</span>
    </p>
    <p>
      兽血Orcblood：兽血武器看起来比同类常规武器更加粗糙和粗陋，但在战斗中的效果丝毫不逊色。在兽人或任何拥有兽人血脉特性的生物手中，兽血武器的增强加值会增加1点，持有者在所有豁免检定上获得+1幸运加值。
    </p>
    <p>
      微弱变化系：CL 5级；制造魔法武器和防具，创造者必须是兽人或具有兽人血脉特性；价格+1加值。
    </p>
